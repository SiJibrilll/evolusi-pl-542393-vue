name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests (including To-Do feature tests)
        run: npm run test -- --run

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Calculate bundle size
        run: |
          echo "=== 📦 Bundle Size Summary ==="
          TOTAL_SIZE=$(du -sh dist/ | cut -f1)
          echo "Total Build Size: $TOTAL_SIZE"
          echo ""
          echo "--- Assets (Uncompressed) ---"
          ls -lh dist/assets/
          echo ""
          echo "--- Assets (Gzipped) ---"
          for file in dist/assets/*; do
            if [ -f "$file" ]; then
              gzip -c "$file" | wc -c | awk -v name="$(basename "$file")" '{ printf "%-35s %8.2f KB (gzip)\n", name, $1/1024 }'
            fi
          done
          echo ""
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "### 📦 Bundle Size Summary" >> $GITHUB_STEP_SUMMARY
            echo "**Total Size:** \`$TOTAL_SIZE\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Asset | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
            for file in dist/assets/*; do
              if [ -f "$file" ]; then
                FNAME=$(basename "$file")
                FSIZE=$(ls -lh "$file" | awk '{print $5}')
                GZSIZE=$(gzip -c "$file" | wc -c | awk '{ printf "%.2f KB", $1/1024 }')
                echo "| \`$FNAME\` | $FSIZE | $GZSIZE |" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi
      - name: Verify no secrets in dist/
        run: |
          echo "Scanning dist/ for 'secret' or 'password'..."
          if grep -ril "secret\|password" dist/; then
            echo "❌ Found matches above — do not deploy."
            exit 1
          else
            echo "✅ No matches. dist/ is clean."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4